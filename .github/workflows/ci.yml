# The only gate between a merge and production.
#
# Nothing else verifies a change before it ships: there are no tests, and the
# agent worktrees under .claude/worktrees/ have no node_modules of their own, so
# typecheck and lint cannot run on the machine where the code is written. That
# work has to happen here. Without it the first build of a change is Vercel's
# production build, which runs AFTER the merge — and a failure there is silent:
# production keeps serving the previous version until someone notices.
#
# The job is named `ci` because that string is the required status check on main.
# Renaming the job renames the check and silently un-protects the branch.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` would run tsc and then bundle; the bundle is Vercel's
      # job. Typecheck alone is the same correctness signal, minus the minute.
      - run: npm run typecheck

      - run: npm run lint
